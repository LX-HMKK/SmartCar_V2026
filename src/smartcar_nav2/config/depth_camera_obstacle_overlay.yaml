# Aurora 930 depth obstacle source for the physical Nav2 stack.
#
# Selecting this overlay adds /smartcar/depth/points while preserving /scan as
# a direct obstacle and inflation input. The relay retimestamps the point cloud
# only after validating Aurora's frame and PointCloud2 layout.
local_costmap:
  local_costmap:
    ros__parameters:
      obstacle_layer:
        observation_sources: "scan depth_points"
        scan:
          topic: /scan
          data_type: LaserScan
          observation_persistence: 0.0
          clearing: true
          marking: true
          obstacle_max_range: 2.5
          obstacle_min_range: 0.25
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          min_obstacle_height: 0.05
          max_obstacle_height: 0.50
          inf_is_valid: false
        depth_points:
          topic: /smartcar/depth/points
          data_type: PointCloud2
          observation_persistence: 0.0
          expected_update_rate: 0.20
          clearing: true
          marking: true
          obstacle_max_range: 3.0
          obstacle_min_range: 0.25
          raytrace_max_range: 3.5
          raytrace_min_range: 0.25
          min_obstacle_height: 0.05
          max_obstacle_height: 1.20

