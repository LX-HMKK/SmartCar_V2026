schema_version: 9
name: shared_route_planning_constraints

# This file is the shared tuning surface for the waypoint editor preflight
# and the simulation Nav2 overlay. sim_tune.sh projects these exact
# dimensions into simulation Nav2. It is not a SLAM/localization map.
# The 0.189 m wheelbase and verified 0.70 rad steering cap give a geometric
# lower bound of 0.2244 m. Keep 0.23 m for the planner/preflight floor so the
# path remains feasible without relying on downstream steering saturation.
minimum_turning_radius_m: 0.23

# Gazebo has a separately constrained Ackermann model. This value is
# synchronized only into the simulation Nav2 overlay; it remains independently
# synchronized from the real-vehicle preflight radius above.
simulation_minimum_turning_radius_m: 0.22

# Measured outer dimensions are full length/width, never half extents.
# base_footprint is the rear axle and the body centre is 0.0841 m forward.
# Reverse planning uses a pi-yaw virtual frame, so Nav2 must use the symmetric
# hull that contains both orientations: raw 0.4382 x 0.13 m, padded
# 0.4982 x 0.19 m. The physical body measurement remains 0.27 x 0.13 m.
runtime_footprint:
  length_m: 0.27
  width_m: 0.13
  center_x_from_base_footprint_m: 0.0841
  padding_m: 0.03

preflight:
  grid_resolution_m: 0.10
  heading_bins: 36
  step_length_m: 0.10
  primitive_samples: 3
  steering_fractions: [-1.0, -0.5, 0.0, 0.5, 1.0]
  turning_penalty_m: 0.015
  # A route may finish inside this Nav2-like goal acceptance region. The
  # editor never draws an unchecked line from that state to the marker.
  goal_position_tolerance_m: 0.15
  goal_heading_tolerance_deg: 20.0
  # Near a target, use an exact forward-only Dubins connection instead of
  # drawing an unchecked straight-line tail from a lattice state.
  terminal_connector_max_distance_m: 1.50
  terminal_connector_max_length_m: 4.00
  terminal_connector_sample_step_m: 0.025
  max_expansions_per_leg: 30000

simulation_costmap:
  # This generic Nav2 obstacle-cost preference applies only to current Gazebo
  # sensor observations. It is independent of vehicle collision geometry and
  # does not represent a prior-map wall or wall-specific clearance.
  inflation_radius_m: 0.30
