# Local Gazebo-only 0.25 m/s trial. sim.launch.py accepts this file only via
# sim_speed_profile:=0.25 and merges it after nav2_keepout_filter.yaml.
# ReverseHandoff is intentionally omitted: its terminal-pose speed cap remains
# the real Nav2 safety contract while testing forward local avoidance.
controller_server:
  ros__parameters:
    ForwardAvoidance:
      desired_linear_vel: 0.25
      forward_max_angular_velocity: 1.1363636363636365
    ForwardHandoff:
      desired_linear_vel: 0.25
      forward_max_angular_velocity: 1.1363636363636365

velocity_smoother:
  ros__parameters:
    max_velocity: [0.25, 0.0, 1.1363636363636365]
    min_velocity: [-0.25, 0.0, -1.1363636363636365]
