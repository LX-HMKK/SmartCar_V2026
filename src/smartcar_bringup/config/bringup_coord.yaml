# SmartCar full-system coordination defaults.
# Distances are meters and rotations are radians. Values marked measured=false
# are placeholders and must not be used for ground motion.

frames:
  odom_frame: odom_combined
  base_frame: base_footprint
  chassis_frame: base_link
  laser_frame: laser

topics:
  raw_odom: /odom
  filtered_odom: /odom_combined
  imu: /imu/data_raw
  scan: /scan
  cmd_vel: /cmd_vel
  cmd_vel_safe: /cmd_vel_safe
  ackermann_cmd: /ackermann_cmd
  image: /image
  depth_points: /smartcar/depth/points

toggles:
  use_base: true
  use_lidar: false
  use_laser_odometry: false
  use_imu_filter: false
  use_robot_description: false
  use_safety: true
  safety_emergency_stop_on_start: false
  use_nav: true
  use_camera: true
  use_vision: true
  use_depth_camera: true
  use_task: true
  use_visualization: false
  use_speech: false
  nav_autostart: true
  autostart_mission: false
  use_sim_time: false

extrinsics:
  base_to_link:
    measured: true
    parent: base_footprint
    child: base_link
    xyz: [0.0841, 0.0, 0.03]
    rpy: [0.0, 0.0, 0.0]
  link_to_laser:
    measured: true
    parent: base_link
    child: laser
    xyz: [-0.05, 0.0, 0.23]
    rpy: [0.0, 0.0, 1.5708]
  link_to_camera:
    measured: true
    parent: base_link
    child_by_driver:
      aurora: rgb_camera_link
      usb: default_usb_cam
      mipi: default_cam
    xyz: [0.1205, 0.0, 0.11]
    rpy: [0.0, 0.0, 0.0]
  link_to_depth_camera:
    # Aurora 930 is mounted directly over the front axle. Its reported height
    # is 0.15 m above ground, so this transform is relative to base_link
    # (base_link is 0.03 m above base_footprint). Point-cloud orientation and
    # obstacle coverage still requires a live point-cloud check before motion,
    # but its fixed physical pose is an accepted structural constraint.
    measured: true
    parent: base_link
    child: depth_camera_link_1
    xyz: [0.1049, 0.0, 0.12]
    # Aurora driver frame: x left, y up, z forward. Map it into base_link
    # (x forward, y left, z up).
    rpy: [1.5708, 0.0, 1.5708]

calibration:
  longitudinal_velocity_scale: 1.03
  gyro_z_bias: -0.00036369
  gyro_z_scale: 1.0
  steering_command_scale: 1.0
  steering_command_offset_rad: 0.0
  max_calibrated_steering_command_rad: 0.70
  wheelbase: 0.189
  max_steering_angle: 0.70

motion_gates:
  waypoints_calibrated: false
  extrinsics_calibrated: false
  steering_calibrated: false
  emergency_stop_ready: false
  operator_approved: false
  laser_odometry_calibrated: false

hardware:
  chassis_serial: /dev/ttyACM0
  lidar_serial: /dev/ttyUSB0
  camera_driver: aurora
