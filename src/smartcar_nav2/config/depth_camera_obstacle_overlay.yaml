# Aurora 930 depth obstacle source for the physical Nav2 stack.
#
# This overlay is selected with use_lidar:=false. The relay corrects Aurora's
# firmware timestamp scale, then preserves the camera acquisition stamp after
# validating the frame and PointCloud2 layout.
local_costmap:
  local_costmap:
    ros__parameters:
      obstacle_layer:
        observation_sources: "depth_scan"
        depth_scan:
          # pointcloud_to_laserscan projects Aurora's 0.14-0.16 m horizontal
          # slice into a forward-only LaserScan. Empty beams publish +Inf, so
          # ObstacleLayer gets explicit free-space rays after an obstacle is
          # removed instead of retaining the prior PointCloud2 endpoint.
          topic: /smartcar/depth/scan
          data_type: LaserScan
          observation_persistence: 0.0
          expected_update_rate: 1.0
          clearing: true
          marking: true
          obstacle_max_range: 3.0
          obstacle_min_range: 0.25
          raytrace_max_range: 3.0
          raytrace_min_range: 0.25
          inf_is_valid: true

global_costmap:
  global_costmap:
    ros__parameters:
      obstacle_layer:
        observation_sources: "depth_scan"
        depth_scan:
          # Keep the forward free-space clearing contract identical to the
          # local costmap.
          topic: /smartcar/depth/scan
          data_type: LaserScan
          observation_persistence: 0.0
          expected_update_rate: 1.0
          clearing: true
          marking: true
          obstacle_max_range: 3.0
          obstacle_min_range: 0.25
          raytrace_max_range: 3.0
          raytrace_min_range: 0.25
          inf_is_valid: true
