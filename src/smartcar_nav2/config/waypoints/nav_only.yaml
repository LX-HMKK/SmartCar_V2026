# 纯导航航点——无需视觉任务（QR/VLM→nav 直通），终点 split 到 p_finish
# 车辆发车前置于 P 区原点，车头朝 +X

calibrated: false

waypoints:
  - id: "p_start"
    frame_id: "odom_combined"
    pose:
      position: { x: 0.0, y: 0.0, z: 0.0 }
      orientation: { x: 0.0, y: 0.0, z: 0.0, w: 1.0 }
    task: "start"

  - id: "a_task_observe"
    frame_id: "odom_combined"
    pose:
      position: { x: 3.45, y: 0.8, z: 0.0 }
      orientation: { x: 0.0, y: 0.0, z: 0.25881905, w: 0.96592583 }
    task: "nav"

  - id: "b_corridor_enter"
    frame_id: "odom_combined"
    pose:
      position: { x: 2.0, y: 1.85, z: 0.0 }
      orientation: { x: 0.0, y: 0.0, z: 0.70710678, w: 0.70710678 }
    task: "corridor"

  - id: "b_corridor_out"
    frame_id: "odom_combined"
    pose:
      position: { x: 2.0, y: 2.4, z: 0.0 }
      orientation: { x: 0.0, y: 0.0, z: 0.70710678, w: 0.70710678 }
    task: "corridor"

  - id: "c_corner_1"
    frame_id: "odom_combined"
    pose:
      position: { x: 0.825, y: 2.75, z: 0.0 }
      orientation: { x: 0.0, y: 0.0, z: 1.0, w: 0.0 }
    task: "nav"

  - id: "c_corner_2"
    frame_id: "odom_combined"
    pose:
      position: { x: 0.825, y: 3.9, z: 0.0 }
      orientation: { x: 0.0, y: 0.0, z: 0.0, w: 1.0 }
    task: "loop"

  - id: "c_corner_3"
    frame_id: "odom_combined"
    pose:
      position: { x: 3.175, y: 3.9, z: 0.0 }
      orientation: { x: 0.0, y: 0.0, z: 0.0, w: 1.0 }
    task: "loop"

  - id: "c_corner_4"
    frame_id: "odom_combined"
    pose:
      position: { x: 3.175, y: 2.75, z: 0.0 }
      orientation: { x: 0.0, y: 0.0, z: 1.0, w: 0.0 }
    task: "loop"

  - id: "b_corridor_return_enter"
    frame_id: "odom_combined"
    pose:
      position: { x: 2.0, y: 2.55, z: 0.0 }
      orientation: { x: 0.0, y: 0.0, z: -0.70710678, w: 0.70710678 }
    task: "corridor"

  - id: "b_corridor_return"
    frame_id: "odom_combined"
    pose:
      position: { x: 2.0, y: 2.4, z: 0.0 }
      orientation: { x: 0.0, y: 0.0, z: -0.70710678, w: 0.70710678 }
    task: "corridor"

  - id: "p_finish"
    frame_id: "odom_combined"
    pose:
      position: { x: 0.0, y: 0.0, z: 0.0 }
      orientation: { x: 0.0, y: 0.0, z: -1.0, w: 0.0 }
    task: "return"
