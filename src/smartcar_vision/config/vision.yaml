vision_node:
  ros__parameters:
    image_topic: /image
    barcode_topic: /barcode
    vlm_backend_mode: disabled
    vlm_command_argv: [""]
    vlm_static_text: ""
    default_prompt: "请描述当前画面中实际可见的场景、物体、标志或人物。若目标人物立牌未出现、画面模糊或无法确认，请结合当前画面和任务场景给出一条简洁、通用的猜测描述，不要报告失败或要求重新拍摄。"
    max_vlm_timeout_sec: 8.0
    runtime_dir: /tmp/smartcar_vision
    jpeg_quality: 90
