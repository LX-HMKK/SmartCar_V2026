# SmartCar full-system coordination defaults.
# Distances are meters and rotations are radians. Values marked measured=false
# are placeholders and must not be used for ground motion.

frames:
  odom_frame: odom_combined
  base_frame: base_footprint
  chassis_frame: base_link
  laser_frame: laser

topics:
  raw_odom: /odom
  filtered_odom: /odom_combined
  imu: /imu/data
  scan: /scan
  cmd_vel: /cmd_vel
  cmd_vel_safe: /cmd_vel_safe
  ackermann_cmd: /ackermann_cmd
  image: /aurora/rgb/image_raw

toggles:
  use_lidar: true
  use_obstacle: true
  use_safety: true
  use_nav: true
  use_camera: true
  use_vision: true
  use_task: true
  nav_autostart: true
  autostart_mission: false
  use_sim_time: false

extrinsics:
  base_to_link:
    measured: false
    parent: base_footprint
    child: base_link
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]
  link_to_laser:
    measured: false
    parent: base_link
    child: laser
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]
  link_to_camera:
    measured: false
    parent: base_link
    child_by_driver:
      aurora: rgb_camera_link
      usb: default_usb_cam
      mipi: default_cam
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 0.0]

motion_gates:
  waypoints_calibrated: false
  extrinsics_calibrated: false
  steering_calibrated: false
  emergency_stop_ready: false
  operator_approved: false

hardware:
  chassis_serial: /dev/ttyACM0
  lidar_serial: /dev/ttyUSB0
  camera_driver: aurora
