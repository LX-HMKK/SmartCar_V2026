# Simulation-only overlay. The real base parameters also load the field
# KeepoutFilter; this file only overrides simulation-specific tuning.
# Gazebo's model uses a 0.189 m wheelbase and a 1.00 rad inner-wheel limit.
# This permits the requested 0.22 m rear-axle radius. The real chain now uses
# the same conservative lower bound after a measured approximately 0.20 m
# physical circle; simulation-only controller and keepout tuning stay local.
bt_navigator:
  ros__parameters:
    # Keep the custom free-heading path validator in the exact same kinematic
    # envelope as the simulation-only Smac and controller overrides below.
    free_heading_minimum_turning_radius: 0.22

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    free_heading_minimum_turning_radius: 0.22

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    free_heading_minimum_turning_radius: 0.22

controller_server:
  ros__parameters:
    # Stop before the physical 0.12 m precise-terminal verification limit.
    # This is a goal acceptance threshold, not a path or steering guide.
    precise_goal_checker:
      xy_goal_tolerance: 0.10
    # The local route's P -> A tree uses stock FollowPath.
    controller_plugins: ["FollowPath", "ForwardAvoidance", "ReverseHandoff", "ReverseRecovery"]
    ForwardAvoidance:
      # Local Gazebo and the production route use one 0.30 m/s operating
      # point. Keep angular speed coupled to the 0.22 m minimum radius.
      desired_linear_vel: 0.30
      # Keep the carrot inside the current local arc so RPP converges before
      # beginning the next obstacle-clear turn.
      lookahead_dist: 0.30
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.30
      use_velocity_scaled_lookahead_dist: false
      regulated_linear_scaling_min_radius: 0.22
      forward_max_angular_velocity: 1.3636363636363635
      forward_min_turning_radius: 0.22
      # Do not let RPP recover a path-tracking error by cutting toward an
      # obstacle or beginning a new large circle. The controller fails to the
      # BT's existing clear/replan branch outside this swept path band.
      forward_path_max_cross_track_error: 0.12
      # Retain full collision checking but do not reduce the requested
      # 0.30 m/s cruise speed just because the path is turning.
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false
    FollowPath:
      # P -> A uses Nav2's stock Regulated Pure Pursuit controller. Keep the
      # only simulation overrides within that controller's native parameters.
      desired_linear_vel: 0.30
      lookahead_dist: 0.5
      min_lookahead_dist: 0.35
      max_lookahead_dist: 0.8
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.1
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_collision_detection: true
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false
      cost_scaling_dist: 0.25
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 5.0
      regulated_linear_scaling_min_radius: 0.22
      regulated_linear_scaling_min_speed: 0.05
      use_rotate_to_heading: false
      allow_reversing: false
    ReverseHandoff:
      # Reverse handoff is also part of the single 0.30 m/s simulation
      # operating point.  Its MPPI sampling envelope must cover that speed.
      vx_max: 0.30
      wz_max: 1.3636363636363635
      vx_std: 0.18
      wz_std: 0.60
      batch_size: 100
      AckermannConstraints:
        min_turning_r: 0.22
    ReverseRecovery:
      # The bounded 0.15 m recovery retains its collision sweep and distance
      # cap, but does not inherit the old 0.05 m/s simulation limit.
      vx_max: 0.30
      vx_std: 0.09
      AckermannConstraints:
        min_turning_r: 0.22

planner_server:
  ros__parameters:
    GridBased:
      # The full-body sweep is authoritative for accepting a plan. Bias the
      # simulation-only Hybrid-A* search away from the corresponding obstacle
      # halo so it finds a safe arc before that independent guard rejects it.
      # This does not alter the on-vehicle planner configuration.
      # The padded-body sweep is stricter than Smac's discrete state check.
      # Increase the simulation-only cost bias so the lattice prefers a
      # visibly clear side of an A-zone obstacle before the independent sweep
      # has to reject the path.
      cost_penalty: 10.0
      # Permit one bounded analytic terminal Dubins connection so the final
      # tangent agrees with the locked task yaw. ComputeFreeHeadingPath still
      # sweeps the complete padded footprint against fresh raw costmap and
      # keepout data before FollowPath can receive it.
      analytic_expansion_max_length: 1.5
      # A local-Gazebo-only vehicle constraint. The matching controller limits
      # and SDF steering geometry are changed together.
      minimum_turning_radius: 0.22
      # Smac collision-checks precomputed footprint headings.  At 72 bins the
      # nearest footprint can differ from an executing arc by 2.5 degrees,
      # enough to create a false clearance beside a narrow obstacle edge.
      # Use 144 bins with the 0.025 m global grid to reduce this discrete
      # heading error below one grid cell. The continuous body sweep remains
      # the authoritative acceptance check.
      angle_quantization_bins: 144
      # The base 20 m lookup table expands to 800 cells at this simulation's
      # 0.025 m resolution and makes every headless route wait more than a
      # minute during planner configuration. All current route chords are
      # below 3.3 m; keep a 6 m local cache and let Smac compute any longer
      # heuristic on demand. This affects startup cost only, never collision
      # checking or the planner's reachable state space.
      lookup_table_size: 6.0

local_costmap:
  local_costmap:
    ros__parameters:
      # Use the same fine grid for RPP collision projection and the full-body
      # sweep. This aligns discretization without shrinking the footprint or
      # turning off controller collision prediction.
      resolution: 0.025
      # Publish every internal update in local Gazebo so RViz and the custom
      # full-body path validator do not observe a half-second-old obstacle map.
      publish_frequency: 10.0
      # Keep scan timestamps tightly coupled to the Gazebo odom->base TF.
      # A larger default window hides a delayed bridge queue as a valid
      # observation and makes RViz / costmap obstacle positions look stale.
      transform_tolerance: 0.10
      # Shared simulation footprint; sync_route_planning.py updates this
      # overlay without ever changing the real-vehicle costmap parameters.
      footprint: "[[0.2191, 0.065], [0.2191, -0.065], [-0.2191, -0.065], [-0.2191, 0.065]]"
      footprint_padding: 0.03
      # The field PGM stays available as an RViz reference, but it is not a
      # simulated navigation constraint. Only current Gazebo sensor returns
      # feed obstacle/inflation cost in this mode.
      # Nav2 1.1.20 cannot deserialize an empty string-array parameter.
      # Keep the plugin declared but disabled, which prevents it from
      # applying the field PGM to this simulation costmap.
      filters: ["keepout_filter"]
      keepout_filter:
        enabled: false
      # The official B-zone opening is 1.0 m wide. The vehicle's padded
      # half-width is 0.095 m, so the real-system 0.55 m inflation radius
      # would mark the entire simulated opening impassable. Gazebo's 0.05 m
      # lidar-slice cone model uses a 0.30 m total inflation radius instead,
      # without changing the real-vehicle configuration. It is not the robot
      # collision envelope: the footprint sweep owns collision acceptance
      # independently of this InflationLayer setting.
      # The scalar is synchronized from route_planning.yaml.
      inflation_layer:
        inflation_radius: 0.30
      obstacle_layer:
        # The headless GPU lidar runs at 20 Hz. Retain only the newest scan and mark
        # the buffer stale if two expected frames are missed; this makes a
        # bridge or TF failure visible instead of silently planning through it.
        scan:
          observation_persistence: 0.0
          expected_update_rate: 0.10
          min_obstacle_height: 0.05
          max_obstacle_height: 0.50
          inf_is_valid: false

global_costmap:
  global_costmap:
    ros__parameters:
      # Humble Smac validates only discrete hybrid states. At the production
      # 0.05 m grid, an analytic Dubins connection can step across a narrow
      # obstacle edge that the continuous padded-body sweep correctly finds.
      # This local-Gazebo grid makes those checks no coarser than 0.025 m;
      # it is intentionally an overlay, not a real-vehicle CPU setting.
      resolution: 0.025
      # Keep the published raw map at the 5 Hz global update rate. The
      # simulation-only planner validator consumes this topic directly.
      publish_frequency: 5.0
      transform_tolerance: 0.10
      footprint: "[[0.2191, 0.065], [0.2191, -0.065], [-0.2191, -0.065], [-0.2191, 0.065]]"
      footprint_padding: 0.03
      # Keep the static field PGM out of simulated navigation costmaps.
      # See the local costmap note above: this plugin is present only to
      # satisfy the non-empty parameter contract and remains disabled.
      filters: ["keepout_filter"]
      keepout_filter:
        enabled: false
      inflation_layer:
        inflation_radius: 0.30
      obstacle_layer:
        scan:
          observation_persistence: 0.0
          expected_update_rate: 0.10
          min_obstacle_height: 0.05
          max_obstacle_height: 0.50
          inf_is_valid: false

velocity_smoother:
  ros__parameters:
    # Couple linear and angular limits to the 0.22 m kinematic envelope.
    max_velocity: [0.30, 0.0, 1.3636363636363635]
    min_velocity: [-0.30, 0.0, -1.3636363636363635]
