schema_version: 7
name: shared_route_planning_constraints

# This file is the shared tuning surface for the waypoint editor preflight
# and the simulation keepout-map generator. sim_tune.sh projects these exact
# dimensions into simulation Nav2. It is not a SLAM/localization map.
# The physical car measured about 0.20 m at the proven 0.70 rad command.
# Keep 0.22 m as the planning/preflight lower bound instead of using that
# measurement limit directly.
minimum_turning_radius_m: 0.22

# Gazebo has a separately constrained Ackermann model. This value is
# synchronized only into the simulation Nav2 overlay; it remains independently
# synchronized from the real-vehicle preflight radius above.
simulation_minimum_turning_radius_m: 0.22

# Measured outer dimensions are full length/width, never half extents.
# base_footprint is the rear axle and the body centre is 0.0841 m forward.
# Reverse planning uses a pi-yaw virtual frame, so Nav2 must use the symmetric
# hull that contains both orientations: raw 0.4382 x 0.13 m, padded
# 0.4982 x 0.19 m. The physical body measurement remains 0.27 x 0.13 m.
runtime_footprint:
  length_m: 0.27
  width_m: 0.13
  center_x_from_base_footprint_m: 0.0841
  padding_m: 0.03

# The central C-zone core forces a loop, while retaining a traversable lane
# around it. Values are measured inward from field_geometry.yaml's inner ring.
c_zone_keepout:
  horizontal_inset_m: 0.80
  vertical_inset_m: 0.15

preflight:
  grid_resolution_m: 0.10
  heading_bins: 36
  step_length_m: 0.10
  primitive_samples: 3
  steering_fractions: [-1.0, -0.5, 0.0, 0.5, 1.0]
  turning_penalty_m: 0.015
  # A route may finish inside this Nav2-like goal acceptance region. The
  # editor never draws an unchecked line from that state to the marker.
  goal_position_tolerance_m: 0.15
  goal_heading_tolerance_deg: 20.0
  # Near a target, use an exact forward-only Dubins connection instead of
  # drawing an unchecked straight-line tail from a lattice state.
  terminal_connector_max_distance_m: 1.50
  terminal_connector_max_length_m: 4.00
  terminal_connector_sample_step_m: 0.025
  max_expansions_per_leg: 30000

simulation_keepout:
  # Keep the mask finer than the padded footprint sweep. The old 0.10 m
  # cells allowed the controller to track a path just outside the visible
  # field edge before the filter could react.
  map_resolution_m: 0.025
  # The PGM extends beyond the playable field by this amount and paints that
  # outer ring lethal. It prevents Nav2 from using unmodelled space around
  # the field as a shortcut while leaving P at (0, 0) initially valid.
  boundary_padding_m: 0.25
  # Cost preference around the simulation-only KeepoutFilter mask. This is
  # separate from the collision footprint: filters own their lethal cells.
  # A 0.05 m lidar-slice cone with a 0.30 m total inflation radius leaves a
  # 0.10 m soft preference outside the physical cone. Collision still uses
  # the padded footprint independently of this soft cost preference.
  costmap_inflation_radius_m: 0.30
