# ros_gz_bridge parameter bridge configuration
# Verified Gazebo topic paths (after ros_gz_sim create spawn)

# Clock: Gazebo → ROS2
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Odometry: Gazebo → ROS2 (AckermannSteering publishes to short /odom)
- ros_topic_name: "/odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# LiDAR scan: Gazebo → ROS2 (short topic when spawned)
- ros_topic_name: "/scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# Command velocity: ROS2 → Gazebo (safety_node → /cmd_vel_safe)
- ros_topic_name: "/cmd_vel_safe"
  gz_topic_name: "/model/origincar/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Joint states: Gazebo → ROS2
- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/smartcar_track/model/origincar/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS
