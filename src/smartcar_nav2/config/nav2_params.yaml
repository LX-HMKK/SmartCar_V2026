bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: odom_combined
    robot_base_frame: base_footprint
    odom_topic: /odom_combined
    # Milliseconds. 20 ms halves the default 100 Hz BT load while remaining
    # faster than the independent 20 Hz path-controller loop.
    bt_loop_duration: 20
    default_server_timeout: 10
    default_nav_to_pose_bt_xml: "@SMARTCAR_NAV2_SHARE_DIR@/config/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "@SMARTCAR_NAV2_SHARE_DIR@/config/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    # Setting plugin_lib_names replaces Nav2's defaults, so retain the full
    # 1.1.20 list and append the project reverse-path node.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_compute_and_track_route_bt_node
