# Local Gazebo-only 0.20 m/s trial. sim.launch.py accepts this file only via
# sim_speed_profile:=0.20 and merges it after nav2_keepout_filter.yaml.
# ReverseHandoff is intentionally omitted: its terminal-pose speed cap remains
# the real Nav2 safety contract while testing forward local avoidance.
controller_server:
  ros__parameters:
    ForwardAvoidance:
      desired_linear_vel: 0.20
      forward_max_angular_velocity: 0.9090909090909091
    ForwardHandoff:
      desired_linear_vel: 0.20
      forward_max_angular_velocity: 0.9090909090909091

velocity_smoother:
  ros__parameters:
    max_velocity: [0.20, 0.0, 0.9090909090909091]
    min_velocity: [-0.20, 0.0, -0.9090909090909091]
