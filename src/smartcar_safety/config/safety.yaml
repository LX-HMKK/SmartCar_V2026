direction_guard:
  ros__parameters:
    # Nav2 command publication remains the in-motion watchdog. Lease renewal
    # is diagnostic only so an unavailable renewal RPC cannot abort a race.
    candidate_timeout_sec: 0.40
    permit_timeout_sec: 0.0
    prepare_timeout_sec: 5.0
    raw_odom_timeout_sec: 0.50
    stop_settle_sec: 0.15
    stop_linear_speed_threshold: 0.01
    stop_angular_speed_threshold: 0.05
    zero_epsilon: 0.000001
    direction_epsilon: 0.0001
    # A forward mission lease may admit only Nav2's finite native BackUp recovery.
    # The C++ boundary rejects any configured value above 0.25 m/s.
    forward_recovery_max_reverse_speed: 0.25
    publish_frequency_hz: 20.0

safety_node:
  ros__parameters:
    command_timeout_sec: 0.30
    odom_timeout_sec: 0.35
    raw_odom_timeout_sec: 0.25
    # The depth-obstacle mode enables this heartbeat at launch time. A valid
    # latest cloud remains usable through one measured source-frame
    # gap. The relay rejects delayed captures by their acquisition timestamp.
    depth_points_timeout_sec: 1.0
    odom_throttle_interval_sec: 0.05
    minimum_voltage: 10.0
    voltage_timeout_sec: 1.0
    max_linear_speed_mps: 0.50
    publish_frequency_hz: 20.0
    require_odom: true
    require_raw_odom: true
    require_depth_points: false
    depth_points_topic: /smartcar/depth/points
    # The direct-pass-through firmware and ground-circle test verified the
    # 0.70 rad command. This is intentionally below no untested command range.
    wheelbase: 0.144
    max_steering_angle: 0.70
    # Disabled by default. When explicitly armed, the bounded service lets the
    # safety node itself hold a zero-speed steering angle for wheel measurement.
    allow_steering_calibration: false
    steering_calibration_max_hold_sec: 15.0
    emergency_stop_on_start: false
