# Local Gazebo-only 0.20 m/s trial. sim.launch.py accepts this file only via
# sim_speed_profile:=0.20 and merges it after nav2_keepout_filter.yaml.
# ReverseHandoff is intentionally omitted: its terminal-pose speed cap remains
# the real Nav2 safety contract while testing the ordinary RPP route.
controller_server:
  ros__parameters:
    FollowPath:
      desired_linear_vel: 0.20

velocity_smoother:
  ros__parameters:
    max_velocity: [0.20, 0.0, 0.75]
    min_velocity: [-0.20, 0.0, -0.75]
