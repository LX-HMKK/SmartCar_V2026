direction_guard:
  ros__parameters:
    # Nav2 command publication remains the in-motion watchdog. Lease renewal
    # is diagnostic only so an unavailable renewal RPC cannot abort a race.
    candidate_timeout_sec: 0.40
    permit_timeout_sec: 0.0
    prepare_timeout_sec: 5.0
    raw_odom_timeout_sec: 0.50
    stop_settle_sec: 0.15
    stop_linear_speed_threshold: 0.01
    stop_angular_speed_threshold: 0.05
    zero_epsilon: 0.000001
    direction_epsilon: 0.0001
    # A forward mission lease may admit only Nav2's one native BackUp action.
    # The C++ boundary rejects any configured value above 0.15 m/s.
    forward_recovery_max_reverse_speed: 0.15
    publish_frequency_hz: 20.0
