schema_version: 1
title: SmartCar pure-navigation route contract
required_root_fields:
  - schema_version
  - name
  - frame_id
  - calibrated
  - source
  - geometry
  - waypoints
fixed_values:
  frame_id: odom_combined
waypoint_fields:
  id: unique nonempty identifier
  zone: one of P, A, B, C
  x: finite meters from P, positive toward the right side of the rule diagram
  y: finite meters from P, positive toward zones B and C
  yaw_deg: finite heading in degrees, normalized to [-180, 180)
invariants:
  - First and last waypoints are the P origin; the first heading is +X.
  - The route contains the estimated task publication point and crosses the B corridor.
  - c_loop_* points form one closed clockwise C-ring centerline circuit.
  - Consecutive c_loop_* points are no farther than 0.25 m apart.
  - calibrated remains false until the route has been measured on the real venue.
