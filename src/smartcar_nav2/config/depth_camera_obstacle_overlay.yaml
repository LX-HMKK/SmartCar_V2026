# Aurora 930 depth obstacle source for the physical Nav2 stack.
#
# This overlay is selected with use_lidar:=false. The relay retimestamps the
# point cloud only after validating Aurora's frame and PointCloud2 layout.
local_costmap:
  local_costmap:
    ros__parameters:
      obstacle_layer:
        observation_sources: "depth_points"
        depth_points:
          topic: /smartcar/depth/points
          data_type: PointCloud2
          observation_persistence: 0.0
          expected_update_rate: 0.20
          clearing: true
          marking: true
          obstacle_max_range: 3.0
          obstacle_min_range: 0.25
          raytrace_max_range: 3.5
          raytrace_min_range: 0.25
          min_obstacle_height: 0.05
          # The Aurora's raised-field reflection is consistently above the
          # vehicle collision envelope. Keep low cones and boards, but reject
          # those overhead returns before they can occupy the 2D costmap.
          max_obstacle_height: 0.30

global_costmap:
  global_costmap:
    ros__parameters:
      obstacle_layer:
        observation_sources: "depth_points"
        depth_points:
          topic: /smartcar/depth/points
          data_type: PointCloud2
          observation_persistence: 0.0
          expected_update_rate: 0.20
          clearing: true
          marking: true
          obstacle_max_range: 3.0
          obstacle_min_range: 0.25
          raytrace_max_range: 3.5
          raytrace_min_range: 0.25
          min_obstacle_height: 0.05
          # Keep this vertical gate identical to the local costmap.
          max_obstacle_height: 0.30
