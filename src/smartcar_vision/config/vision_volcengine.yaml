vision_node:
  ros__parameters:
    image_topic: /image
    barcode_topic: /barcode
    vlm_backend_mode: command
    vlm_command_argv:
      - python3
      - -X
      - utf8
      - -m
      - smartcar_vision.volcengine_vlm_cli
      - --image
      - "{image}"
      - --prompt
      - "{prompt}"
      - --model
      - doubao-seed-2-0-lite-260428
      - --timeout-sec
      - "7.0"
      - --max-tokens
      - "256"
    vlm_static_text: ""
    default_prompt: "请简洁描述当前画面中实际可见的场景、物体、标志或人物。若目标人物立牌未出现、画面模糊或无法确认，请结合当前画面和任务场景给出一条简洁、通用的猜测描述，不要报告失败或要求重新拍摄。"
    max_vlm_timeout_sec: 8.0
    runtime_dir: /tmp/smartcar_vision
    jpeg_quality: 90
