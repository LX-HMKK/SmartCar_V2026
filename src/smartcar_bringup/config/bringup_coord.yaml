# smartcar_bringup 协调层 config（参考约定）
#
# 说明：smartcar_bringup 是 launch 组合器，自身不启 Node，故本文件为协调层约定的
# 单一事实来源（帧名/话题/开关默认值/设备端口），smartcar_bringup.launch.py 的
# DeclareLaunchArgument 默认值与之对齐。各功能包自身 config（ekf.yaml/imu.yaml/
# ydlidar.yaml）由 vendor 包持有，本文件不接管。
#
# 命名统一到 RDK 实际（见 spec §5）：/odom_combined 话题 + odom_combined 帧。

# ---- 全局帧名约定 ----
frames:
  odom_frame: odom_combined      # EKF 全局里程计帧（方案 /odometry/filtered+odom 统一到此）
  base_frame: base_footprint     # EKF base 帧
  laser_frame: laser             # LiDAR 帧（对齐 bringup 静态 TF，非 laser_frame）

# ---- 基础话题 ----
topics:
  odom: /odom_combined           # nav_msgs/Odometry ~20Hz（EKF）
  imu: /imu/data                 # sensor_msgs/Imu ~20Hz
  scan: /scan                    # sensor_msgs/LaserScan ~10Hz（ydlidar）
  cmd_vel: /cmd_vel              # geometry_msgs/Twist（Nav2 发布，底盘订阅）
  robot_description: /robot_description

# ---- 功能开关默认值 ----
toggles:
  use_lidar: true                # 启动 LiDAR 驱动
  use_obstacle: true             # 启动 obstacle_detector
  use_nav: false                 # 预留：Nav2（smartcar_nav2 未就绪）
  use_sim_time: false            # 实车不用仿真时间

# ---- 设备端口（vendor config 持有，此处记录事实）----
hardware:
  chassis_serial: /dev/ttyACM0   # OriginCar 底盘，115200
  lidar_serial: /dev/ttyUSB0     # YDLIDAR Tmini Plus，230400

# ---- 已知遗留（见 spec §11）----
todo:
  base_to_link_offset: "x=0.41,y=0.12 待赛前实车标定复核（base_footprint->base_link 通常应为 0,0,0）"
  tf_dedup: "核对 origincar.urdf 与 3 个 static_transform_publisher 去重"
