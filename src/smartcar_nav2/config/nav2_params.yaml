controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker", "precise_goal_checker", "reverse_goal_checker"]
    current_goal_checker: "goal_checker"
    controller_plugins: ["FollowPath", "ReverseHandoff"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 8.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.40
      yaw_goal_tolerance: 0.50
      stateful: false
    # The QR pose seeds a direction change. This smaller envelope stays clear
    # of the long-CCC handoff region found in the offline Dubins sampling.
    precise_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.15
      stateful: false
    reverse_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.25
      stateful: false
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.15
      lookahead_dist: 1.0
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.5
      lookahead_time: 1.5
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.4
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_collision_detection: true
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.25
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 5.0
      regulated_linear_scaling_min_radius: 0.55
      regulated_linear_scaling_min_speed: 0.05
      use_rotate_to_heading: false
      allow_reversing: true
    # The reverse-to-forward handoff needs closed-loop terminal pose control.
    # The wrapper maps the real reverse path and odometry into a virtual
    # positive-forward Ackermann problem, then maps the command back through a
    # final reverse-only velocity and curvature guard.
    ReverseHandoff:
      plugin: "smartcar_nav2::ReverseOnlyMPPIController"
      time_steps: 100
      model_dt: 0.05
      batch_size: 1000
      iteration_count: 2
      vx_std: 0.035
      vy_std: 0.0
      wz_std: 0.12
      vx_max: 0.09
      vx_min: 0.02
      vy_max: 0.0
      wz_max: 0.20
      prune_distance: 0.6
      transform_tolerance: 0.1
      temperature: 0.2
      gamma: 0.015
      motion_model: "Ackermann"
      visualize: false
      retry_attempt_limit: 1
      reset_period: 1.0
      regenerate_noises: false
      AckermannConstraints:
        min_turning_r: 0.55
      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 16.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.30
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.70
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        threshold_to_consider: 0.70
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        max_path_occupancy_ratio: 0.10
        trajectory_point_step: 2
        threshold_to_consider: 0.30
        offset_from_furthest: 4
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        offset_from_furthest: 4
        threshold_to_consider: 0.70
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        offset_from_furthest: 2
        threshold_to_consider: 0.30
        max_angle_to_furthest: 0.55
        forward_preference: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom_combined
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.03
      # pi-invariant conservative hull. MPPI evaluates the same physical body
      # at a virtual yaw shifted by pi, so an asymmetric rear-axle footprint
      # would swap its front and rear collision extents.
      footprint: "[[0.27, 0.13], [0.27, -0.13], [-0.27, -0.13], [-0.27, 0.13]]"
      footprint_padding: 0.03
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        enabled: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: false
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 5.0
          obstacle_min_range: 0.25
          raytrace_max_range: 5.5
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.55
        cost_scaling_factor: 5.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: odom_combined
      robot_base_frame: base_footprint
      rolling_window: true
      track_unknown_space: false
      width: 10
      height: 10
      resolution: 0.10
      # pi-invariant hull of the real footprint. This keeps virtual-yaw
      # reverse planning collision-equivalent to the physical vehicle.
      footprint: "[[0.27, 0.13], [0.27, -0.13], [-0.27, -0.13], [-0.27, 0.13]]"
      footprint_padding: 0.03
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        enabled: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: false
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 5.0
          obstacle_min_range: 0.25
          raytrace_max_range: 5.5
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.65
        cost_scaling_factor: 5.0
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      # Semantic waypoints, especially the QR direction handoff, must not be
      # replaced by a nearby planner endpoint. Fail and replan if exact is blocked.
      # 0.25 m gives one full 0.1 m static-map cell of slack — enough to absorb
      # cell-boundary occupancy without skipping waypoint geometry.
      tolerance: 0.25
      allow_unknown: true
      max_iterations: 100000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      # Forward-only search. Reverse paths are generated by rotating the
      # vehicle headings by pi in the reverse BT node, then restoring them.
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 144
      # Restored to default: intermediate zeros avoid shortcutting; too low
      # starves analytic expansion and forces grid-edge cusps.
      analytic_expansion_ratio: 2.0
      analytic_expansion_max_length: 5.0
      minimum_turning_radius: 0.55
      # Raised from 1.2 to discourage unnecessary direction changes, but not
      # so high that the planner avoids smooth Dubins curves in favor of
      # grid edges (which produce curvature spikes in validation).
      non_straight_penalty: 2.0
      cost_penalty: 2.0
      # Tuned to improve heuristic consistency and reduce dead-end expansions.
      retrospective_penalty: 0.05
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true
      smooth_path: true

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    # Preserve the Ackermann curvature cone while acceleration limits ramp the
    # command before the downstream direction guard.
    scale_velocities: true
    feedback: "OPEN_LOOP"
    max_velocity: [0.15, 0.0, 0.75]
    min_velocity: [-0.15, 0.0, -0.75]
    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-2.0, 0.0, -2.0]
    odom_topic: "odom_combined"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.10
