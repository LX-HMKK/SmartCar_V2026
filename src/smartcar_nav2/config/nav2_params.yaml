bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: odom_combined
    robot_base_frame: base_footprint
    odom_topic: /odom_combined
    # Milliseconds. 20 ms halves the default 100 Hz BT load while remaining
    # faster than the independent 20 Hz path-controller loop.
    bt_loop_duration: 20
    # Nav2 interprets this value in milliseconds.  Ten milliseconds is below
    # the observed local-costmap clear round trip in the simulator, which made
    # a legitimate collision recovery abort before it could replan.
    default_server_timeout: 100
    default_nav_to_pose_bt_xml: "@SMARTCAR_NAV2_SHARE_DIR@/config/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "@SMARTCAR_NAV2_SHARE_DIR@/config/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    # Setting plugin_lib_names replaces Nav2's defaults. Load only native
    # nodes used by path tracking and finite native BackUp recovery.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_back_up_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_smooth_path_action_bt_node
      - smartcar_remove_duplicate_path_points_bt_node

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false
    global_frame: odom_combined
    robot_base_frame: base_footprint
    odom_topic: /odom_combined
    bt_loop_duration: 20
    # Keep the ThroughPoses navigator aligned with the primary navigator.
    default_server_timeout: 100
    default_nav_to_pose_bt_xml: "@SMARTCAR_NAV2_SHARE_DIR@/config/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "@SMARTCAR_NAV2_SHARE_DIR@/config/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    # Same minimal native node set as the primary navigator.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_back_up_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_smooth_path_action_bt_node
      - smartcar_remove_duplicate_path_points_bt_node

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    # Controller velocity feedback must use the EKF-owned odometry source.
    # In Gazebo the Ackermann plugin's /odom is an independent integrated
    # estimate and can diverge from the odom_combined -> base_footprint TF.
    odom_topic: /odom_combined
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    # A collision prediction is a path-tracking failure, not a paused
    # command. Fail FollowPath immediately so the native RecoveryNode runs
    # its bounded BackUp and live-costmap replan instead of holding zero
    # velocity for controller patience. Keep RPP collision detection enabled
    # below: it is what prevents a forward command into the obstacle.
    failure_tolerance: 0.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker", "precise_goal_checker", "return_goal_checker", "transit_goal_checker"]
    current_goal_checker: "goal_checker"
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 15.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 0.50
      stateful: false
    # The precise profile keeps spatial arrival tight while allowing a
    # forward-only vehicle to complete at a bounded terminal-heading error,
    # rather than loop beyond an endpoint to chase that last yaw difference.
    precise_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.65
      stateful: false
    # P is a position terminal. Once a forward-only Ackermann vehicle is in
    # this envelope it must stop, rather than driving past P to chase a final
    # heading that would require an extra loop.
    return_goal_checker:
      plugin: "nav2_controller::PositionGoalChecker"
      xy_goal_tolerance: 0.15
      stateful: false
    # Non-task route points are position constraints.  Requiring an arrival
    # yaw here makes an Ackermann vehicle overshoot a valid transit point
    # while trying to remove a heading error it was never asked to satisfy.
    transit_goal_checker:
      plugin: "nav2_controller::PositionGoalChecker"
      # Transit gates are position-only. A 0.40 m envelope accommodates the
      # corridor pass-through margin before the next segment starts.
      # Task poses retain their own precise/yaw-aware checkers.
      xy_goal_tolerance: 0.40
      stateful: false
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.60
      # Keep the effective RPP tracking lookahead fixed at 0.50 m. Velocity
      # scaling remains enabled, but identical bounds prevent it from changing
      # the configured forward tracking horizon.
      lookahead_dist: 0.50
      min_lookahead_dist: 0.50
      max_lookahead_dist: 0.50
      lookahead_time: 1.5
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_collision_detection: true
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.25
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 5.0
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.05
      use_rotate_to_heading: false
      allow_reversing: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom_combined
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.03
      # Conservative hull of the physical body for live Nav2 costmaps.
      footprint: "[[0.2191, 0.065], [0.2191, -0.065], [-0.2191, -0.065], [-0.2191, 0.065]]"
      footprint_padding: 0.03
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          # A rolling costmap must not retain a historical scan after the next
          # update. Clearing rays still remove cells that disappeared from the
          # current scan, while this prevents old observations from being
          # replayed after a delayed sensor frame.
          observation_persistence: 0.0
          clearing: true
          marking: true
          obstacle_max_range: 2.5
          obstacle_min_range: 0.25
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          # The laser frame is about 0.26 m above base_footprint.  Set the
          # height window explicitly; Nav2's zero default rejects every scan
          # return before the obstacle layer can feed InflationLayer.
          min_obstacle_height: 0.05
          max_obstacle_height: 0.50
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.3
        cost_scaling_factor: 5.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: odom_combined
      robot_base_frame: base_footprint
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      # Conservative hull of the real footprint for planning and tracking.
      footprint: "[[0.2191, 0.065], [0.2191, -0.065], [-0.2191, -0.065], [-0.2191, 0.065]]"
      footprint_padding: 0.03
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          observation_persistence: 0.0
          clearing: true
          marking: true
          obstacle_max_range: 2.5
          obstacle_min_range: 0.25
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          # Keep the production and simulation observation height contracts
          # identical so the physical laser returns are marked consistently.
          min_obstacle_height: 0.05
          max_obstacle_height: 0.50
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.3
        cost_scaling_factor: 5.0
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      # Semantic waypoints must not be replaced by a nearby planner endpoint.
      # Fail and replan if an exact goal is blocked.
      tolerance: 0.0
      allow_unknown: true
      max_iterations: 100000
      max_on_approach_iterations: 1000
      # Bound one native Hybrid-A* search so a failed planning attempt leaves
      # time for Nav2's costmap-clear and replan recovery.
      max_planning_time: 1.0
      # Forward-only native Hybrid-A* search.
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 144
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      # Match the physical preflight floor. The conservative 0.23 m stays
      # above the 0.1710 m Ackermann limit from the measured wheelbase and cap.
      minimum_turning_radius: 0.23
      non_straight_penalty: 1.2
      # Collision and footprint clearance are evaluated by Nav2's live
      # costmaps during planning and tracking.
      cost_penalty: 5.0
      retrospective_penalty: 0.015
      # The global field costmap spans 5.5 m. This is only a startup heuristic
      # cache, not a planning bound; requests beyond it are computed on demand.
      # An 8 m cache retains a map-scale margin without the long RDK precompute.
      lookup_table_size: 8.0
      cache_obstacle_heuristic: false
      # Do not use Humble's in-planner smoother: it does not retain the
      # Hybrid-A* curvature bound. The BT invokes the constrained smoother
      # below after planning, with the same radius and live costmap checks.
      smooth_path: false

smoother_server:
  ros__parameters:
    use_sim_time: false
    # Smoothing is checked against the global, live obstacle/inflation map so
    # the complete route is evaluated with the physical vehicle footprint.
    costmap_topic: global_costmap/costmap_raw
    footprint_topic: global_costmap/published_footprint
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    smoother_plugins: ["constrained_smoother"]
    constrained_smoother:
      plugin: "nav2_constrained_smoother/ConstrainedSmoother"
      # The navigation contract is forward-only. There are no reverse cusps
      # for the optimizer to infer from route orientations.
      reversing_enabled: false
      path_downsampling_factor: 1
      path_upsampling_factor: 1
      keep_start_orientation: true
      keep_goal_orientation: true
      # Match the forward-only Hybrid-A* feasibility floor.
      minimum_turning_radius: 0.23
      w_curve: 30.0
      # Permit smooth corner cutting only when the complete footprint remains
      # collision-free; collision validation is requested by SmoothPath.
      w_dist: 0.0
      w_smooth: 2000000.0
      w_cost: 0.015
      w_cost_cusp_multiplier: 1.0
      cusp_zone_length: -1.0
      optimizer:
        max_iterations: 70
        debug_optimizer: false
        gradient_tol: 5.0e3
        fn_tol: 1.0e-15
        param_tol: 1.0e-20

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    # Preserve the Ackermann curvature cone while acceleration limits ramp the
    # command before the downstream direction guard.
    scale_velocities: true
    feedback: "OPEN_LOOP"
    max_velocity: [0.60, 0.0, 1.3636363636363635]
    # The only negative command source is Nav2's finite native BackUp recovery.
    min_velocity: [-0.15, 0.0, -1.3636363636363635]
    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-2.0, 0.0, -2.0]
    odom_topic: "/odom_combined"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.10

behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: odom_combined
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup"]
    backup:
      plugin: "nav2_behaviors/BackUp"
