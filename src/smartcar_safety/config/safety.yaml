safety_node:
  ros__parameters:
    command_timeout_sec: 0.30
    scan_timeout_sec: 0.35
    odom_timeout_sec: 0.35
    raw_odom_timeout_sec: 0.25
    odom_throttle_interval_sec: 0.05
    minimum_voltage: 10.0
    publish_frequency_hz: 20.0
    require_scan: true
    require_odom: true
    require_raw_odom: true
    # The direct-pass-through firmware and ground-circle test verified the
    # 0.70 rad command. This is intentionally below no untested command range.
    wheelbase: 0.189
    max_steering_angle: 0.70
    # Disabled by default. When explicitly armed, the bounded service lets the
    # safety node itself hold a zero-speed steering angle for wheel measurement.
    allow_steering_calibration: false
    steering_calibration_max_hold_sec: 15.0
    emergency_stop_on_start: false
